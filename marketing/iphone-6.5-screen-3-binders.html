<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Dexeon App Store screen</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap"><style>
  /* ───────────── Tokens ───────────── */
  :root{
    --paper:#F2F3EF;        /* newsprint white */
    --paper-2:#FFFFFF;      /* panel fill */
    --ink:#121114;          /* warm black ink */
    --ink-soft:#4A484E;     /* body copy */
    --tone:#B9BCB5;         /* screentone gray */
    --tone-2:#DDDFD8;       /* faint rule */
    --red:#C8322E;          /* brand red, bridging the app's #AC322F */
    --red-deep:#AC322F;     /* the app's accent, exact */
    --yellow:#F7C728;       /* one impact burst */
    --blue:#2E5AAC;         /* the app's chase blue */
    --green:#2FA44F;
    --shadow-ink:8px 8px 0 var(--ink);
    --shadow-ink-sm:4px 4px 0 var(--ink);
    --display:"Anton","Impact","Arial Narrow",sans-serif;
    --sfx:"Bangers","Impact",sans-serif;
    --body:"M PLUS Rounded 1c","Nunito","Hiragino Maru Gothic ProN","SF Pro Rounded",system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#131316; --paper-2:#1B1B1F; --ink:#F1F0EA; --ink-soft:#B8B6BE;
      --tone:#3A3A40; --tone-2:#2A2A2F; --red:#E0463F; --red-deep:#C8322E;
      --yellow:#F7C728; --blue:#5B86D6; --green:#43C06A; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#131316; --paper-2:#1B1B1F; --ink:#F1F0EA; --ink-soft:#B8B6BE;
    --tone:#3A3A40; --tone-2:#2A2A2F; --red:#E0463F; --red-deep:#C8322E;
    --yellow:#F7C728; --blue:#5B86D6; --green:#43C06A; color-scheme:dark;
  }

  /* ───────────── Base ───────────── */
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); font-size:17px; line-height:1.6; font-weight:500;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  img{max-width:100%; display:block}
  a{color:inherit}
  h1,h2,h3{margin:0; text-wrap:balance}
  p{margin:0}
  :focus-visible{outline:3px solid var(--yellow); outline-offset:3px}
  .wrap{width:min(1180px, calc(100% - 48px)); margin-inline:auto}
  @media (max-width:640px){ .wrap{width:calc(100% - 32px)} }

  /* Manga texture helpers */
  .tone{background-image:radial-gradient(var(--tone) 1px, transparent 1.3px); background-size:7px 7px}
  .display{font-family:var(--display); font-weight:400; text-transform:uppercase; letter-spacing:.005em; line-height:.92}
  .kana{font-family:var(--body); font-weight:900; letter-spacing:.12em}
  .eyebrow{display:inline-flex; align-items:center; gap:10px; font-size:12px; font-weight:900; letter-spacing:.18em; text-transform:uppercase}
  .eyebrow::before{content:""; width:28px; height:3px; background:var(--red)}
  .lede{font-size:clamp(17px,1.35vw,20px); color:var(--ink-soft); max-width:34em; font-weight:500}
  .panel{position:relative; background:var(--paper-2); border:3px solid var(--ink); box-shadow:var(--shadow-ink)}
  .sfx{
    font-family:var(--sfx); letter-spacing:.04em; color:var(--paper-2);
    background:var(--red); border:3px solid var(--ink); padding:6px 14px 4px;
    display:inline-block; transform:rotate(-6deg); box-shadow:var(--shadow-ink-sm);
    font-size:clamp(22px,2.6vw,34px); line-height:1;
  }
  .sfx.y{background:var(--yellow); color:#121114}
  .sfx.b{background:var(--blue)}
  .btn{
    display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    font-weight:900; font-size:16px; letter-spacing:.02em; padding:16px 26px;
    border:3px solid var(--ink); background:var(--red); color:#fff;
    box-shadow:var(--shadow-ink-sm); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink)}
  .btn.ghost{background:var(--paper-2); color:var(--ink)}
  .btn svg{width:18px; height:18px}

  /* ───────────── Nav ───────────── */
  .nav{position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:3px solid var(--ink)}
  .nav .wrap{display:flex; align-items:center; justify-content:space-between; height:68px; gap:20px}
  .logo{display:flex; align-items:center; gap:12px; text-decoration:none}
  .logo img{width:38px; height:38px; border-radius:10px; border:2px solid var(--ink)}
  .logo b{font-family:var(--display); font-weight:400; font-size:26px; letter-spacing:.02em; line-height:1}
  .logo small{display:block; font-size:10px; font-weight:900; letter-spacing:.3em; color:var(--red); line-height:1; margin-top:2px}
  .nav nav{display:flex; gap:28px}
  .nav nav a{text-decoration:none; font-weight:800; font-size:14px; letter-spacing:.04em; text-transform:uppercase}
  .nav nav a:hover{color:var(--red)}
  .nav .btn{padding:10px 18px; font-size:14px}
  @media (max-width:820px){ .nav nav{display:none} }

  /* ───────────── Hero ───────────── */
  .hero{position:relative; overflow:hidden; border-bottom:3px solid var(--ink)}
  .hero .kana-bg{
    position:absolute; top:-2vw; left:-1vw; font-size:clamp(120px,22vw,320px); line-height:1;
    color:transparent; -webkit-text-stroke:2px var(--tone); opacity:.55; pointer-events:none;
    user-select:none; white-space:nowrap; letter-spacing:.02em;
  }
  .hero .wrap{
    position:relative; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    gap:clamp(24px,4vw,64px); align-items:center; padding:clamp(56px,8vw,110px) 0; min-height:min(88vh,840px);
  }
  .hero-copy{position:relative; z-index:2}
  .hero h1{font-size:clamp(60px,9vw,136px); margin:18px 0 26px; transform:skewX(-6deg); text-shadow:4px 4px 0 var(--paper), 7px 7px 0 var(--ink)}
  .hero h1 .line{display:block}
  .hero h1 .red{color:var(--red)}
  .hero .cta{display:flex; flex-wrap:wrap; gap:16px; margin-top:34px; align-items:center}
  .hero .meta{margin-top:28px; display:flex; flex-wrap:wrap; gap:10px 22px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft)}
  .hero .meta span{display:inline-flex; align-items:center; gap:8px}
  .hero .meta i{width:10px; height:10px; border-radius:50%; background:var(--red); border:2px solid var(--ink); display:inline-block}
  .hero-stage{position:relative; z-index:1; align-self:center; display:flex; justify-content:center}
  .speed{
    position:absolute; inset:-30% -40% -10% -40%; pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 58%, var(--ink) 0deg .5deg, transparent .5deg 3.4deg);
    -webkit-mask:radial-gradient(ellipse at 50% 58%, transparent 26%, #000 46%, transparent 74%);
            mask:radial-gradient(ellipse at 50% 58%, transparent 26%, #000 46%, transparent 74%);
    opacity:.28;
  }
  .hero .sfx.hero-sfx{position:absolute; right:-6px; top:8%; z-index:3; transform:rotate(8deg)}
  .hero .sfx.hero-sfx2{position:absolute; left:-18px; bottom:22%; z-index:3; transform:rotate(-9deg)}
  .stat-tag{
    position:absolute; left:-24px; top:34%; z-index:3; background:var(--paper-2); border:3px solid var(--ink);
    box-shadow:var(--shadow-ink-sm); padding:10px 14px; font-weight:900; font-size:13px; line-height:1.15;
  }
  .stat-tag b{display:block; font-family:var(--display); font-weight:400; font-size:30px; color:var(--red); letter-spacing:.01em}
  @media (max-width:900px){
    .hero .wrap{grid-template-columns:1fr; min-height:0}
    .hero-stage{padding-top:32px}
    .stat-tag{left:0}
    .hero .sfx.hero-sfx{right:0; top:-18px}
    .hero .sfx.hero-sfx2{left:0}
  }

  /* ───────────── Ticker ───────────── */
  .ticker{background:var(--ink); color:var(--paper); border-bottom:3px solid var(--ink); overflow:hidden; white-space:nowrap}
  .ticker .track{display:inline-flex; gap:0; animation:tick 44s linear infinite; padding:12px 0}
  .ticker span{font-family:var(--display); font-size:22px; letter-spacing:.06em; text-transform:uppercase; padding:0 22px}
  .ticker span::before{content:"✦"; color:var(--yellow); margin-right:22px; font-family:var(--body)}
  @keyframes tick{to{transform:translateX(-50%)}}

  /* ───────────── Sections ───────────── */
  section.block{padding:clamp(72px,9vw,128px) 0}
  .sec-head{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; align-items:end; margin-bottom:clamp(36px,5vw,64px)}
  .sec-head h2{font-size:clamp(44px,5.6vw,84px); margin-top:14px; transform:skewX(-6deg); text-shadow:3px 3px 0 var(--paper), 5px 5px 0 var(--ink)}
  @media (max-width:820px){ .sec-head{grid-template-columns:1fr} }

  /* Feature panel grid */
  .feat{
    display:grid; gap:26px; grid-template-columns:repeat(6,minmax(0,1fr));
    grid-template-areas:
      "dex dex dex cards cards cards"
      "scan scan price price chase chase"
      "scan scan price price show show"
      "value value value sets sets sets";
  }
  .feat .panel{padding:48px 28px 28px; display:flex; flex-direction:column; gap:14px; min-height:220px}
  .feat .panel h3{font-family:var(--display); font-weight:400; font-size:30px; letter-spacing:.01em; line-height:1; text-transform:uppercase}
  .feat .panel p{color:var(--ink-soft); font-size:15.5px}
  .feat .panel .tag{position:absolute; top:-3px; left:-3px; background:var(--ink); color:var(--paper); font-size:11px; font-weight:900; letter-spacing:.2em; padding:5px 10px; text-transform:uppercase}
  .f-dex{grid-area:dex} .f-cards{grid-area:cards} .f-scan{grid-area:scan} .f-price{grid-area:price} .f-chase{grid-area:chase}
  .f-show{grid-area:show} .f-value{grid-area:value} .f-sets{grid-area:sets}
  .feat .f-chase{background:var(--blue); color:#fff} .feat .f-chase p,.feat .f-chase h3{color:#fff}
  .f-chase .tag{background:#fff; color:var(--ink)}
  .feat .f-scan{background:var(--ink); color:var(--paper)} .feat .f-scan p,.feat .f-scan h3{color:var(--paper)}
  .f-scan .tag{background:var(--red); color:#fff}
  .f-price{justify-content:flex-start}
  @media (max-width:980px){
    .feat{grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-areas:"dex dex" "cards cards" "scan price" "scan price" "chase show" "value sets"}
  }
  @media (max-width:640px){
    .feat{grid-template-columns:1fr; grid-template-areas:"dex" "cards" "scan" "price" "chase" "show" "value" "sets"; gap:22px}
    .feat .panel{padding:42px 22px 22px}
  }

  /* In-panel bits */
  .scan-mock{position:relative; margin-top:auto; aspect-ratio:4/3; background:#1C1C20; border:3px solid var(--paper); overflow:hidden; display:grid; place-items:center}
  .scan-mock img{width:46%; transform:rotate(-7deg); border-radius:6px; box-shadow:0 14px 28px rgba(0,0,0,.6)}
  .scan-mock i{position:absolute; width:22px; height:22px; border:3px solid var(--yellow)}
  .scan-mock i:nth-child(1){top:10px; left:10px; border-right:0; border-bottom:0}
  .scan-mock i:nth-child(2){top:10px; right:10px; border-left:0; border-bottom:0}
  .scan-mock i:nth-child(3){bottom:10px; left:10px; border-right:0; border-top:0}
  .scan-mock i:nth-child(4){bottom:10px; right:10px; border-left:0; border-top:0}
  .scan-mock .match{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); white-space:nowrap; background:var(--green); color:#fff; font-size:12px; font-weight:900; padding:6px 12px; border-radius:99px; border:2px solid #fff}
  .spark{margin-top:auto; width:100%; height:72px; display:block}
  .spark path{fill:none; stroke:var(--green); stroke-width:3; stroke-linejoin:round; stroke-linecap:round}
  .spark .fill{fill:color-mix(in srgb, var(--green) 14%, transparent); stroke:none}
  .spark circle{fill:var(--green); stroke:var(--paper-2); stroke-width:2}
  .value-row{display:flex; justify-content:space-between; font-weight:900; font-variant-numeric:tabular-nums; font-size:14px}
  .value-row small{display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:800}
  .value-row .up{color:var(--green)}
  .ui-progress{display:flex; align-items:center; gap:12px; background:var(--paper); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); border-radius:16px; padding:10px 16px; font-weight:900; font-variant-numeric:tabular-nums}
  .ui-progress .bar{flex:1; height:8px; background:color-mix(in srgb, var(--ink) 8%, transparent); border-radius:99px; overflow:hidden}
  .ui-progress .bar i{display:block; height:100%; width:42%; background:var(--red-deep); border-radius:99px}
  .ui-progress small{font-size:13px; color:var(--ink-soft); font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; padding:6px 12px; border-radius:99px; border:2px solid var(--ink); background:var(--paper); box-shadow:2px 2px 0 var(--ink)}
  .chip.on{background:var(--red-deep); color:#fff}
  .price-mock{display:grid; grid-template-columns:82px minmax(0,1fr); gap:14px; align-items:start; margin-top:6px}
  .price-mock img{border-radius:8px; border:2px solid var(--ink); width:82px}
  .price-mock .big{font-size:28px; font-weight:900; color:var(--green); line-height:1; font-variant-numeric:tabular-nums}
  .price-mock .lbl{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft)}
  .price-mock .row{display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:8px; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums}
  .price-mock .row small{display:block; font-size:9.5px; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase}
  .price-hist{margin-top:auto}
  .price-hist .lbl{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); display:flex; justify-content:space-between}
  .price-hist .lbl span{color:var(--green)}
  .price-hist .spark{margin-top:6px; height:64px}
  .actions{display:flex; gap:6px; margin-top:14px}
  .actions span{flex:1; text-align:center; font-size:10px; font-weight:900; padding:9px 2px; border-radius:10px; line-height:1.2; white-space:nowrap}
  .actions .c{background:var(--green); color:#fff} .actions .h{background:color-mix(in srgb, var(--blue) 14%, transparent); color:var(--blue)} .actions .s{background:color-mix(in srgb, #F08A24 14%, transparent); color:#D97A1A} .actions .t{background:color-mix(in srgb, var(--ink) 8%, transparent); color:var(--ink)}
  .mini-cards{display:flex; gap:10px; margin-top:auto}
  .mini-cards img{width:calc(25% - 8px); border-radius:6px; border:2px solid var(--ink)}
  .setrow{margin-top:auto; display:grid; gap:8px}
  .setrow div{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; font-size:13px; font-weight:800}
  .setrow .bar{grid-column:1/-1; height:7px; border-radius:99px; background:color-mix(in srgb, var(--ink) 8%, transparent); overflow:hidden}
  .setrow .bar i{display:block; height:100%; background:var(--red-deep)}
  .setrow small{font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}

  /* ───────────── Social (night spread) ───────────── */
  .night{background:var(--ink); color:var(--paper); position:relative; clip-path:polygon(0 3.5vw, 100% 0, 100% calc(100% - 3.5vw), 0 100%); padding:clamp(96px,12vw,170px) 0}
  .night .tone-bg{position:absolute; inset:0; background-image:radial-gradient(var(--paper) 1px, transparent 1.3px); background-size:9px 9px; opacity:.07; pointer-events:none}
  .night .eyebrow{color:var(--paper)} .night .eyebrow::before{background:var(--yellow)}
  .night h2{color:var(--paper); text-shadow:3px 3px 0 var(--ink), 5px 5px 0 var(--red)}
  .night .lede{color:color-mix(in srgb, var(--paper) 72%, transparent)}
  .social-head{text-align:center; max-width:820px; margin:0 auto}
  .social-head h2{font-size:clamp(44px,6vw,92px); margin-top:14px; transform:skewX(-6deg)}
  .social-head .lede{margin:22px auto 0}
  .trio{position:relative; display:flex; justify-content:center; align-items:flex-end; gap:0; margin:clamp(40px,5vw,72px) auto 0; min-height:640px}
  .trio .phone{transition:transform .35s ease}
  .trio .p-left{position:absolute; left:50%; margin-left:-470px; bottom:20px; transform:rotate(-7deg) scale(.86); z-index:1; filter:brightness(.94)}
  .trio .p-mid{position:relative; z-index:3}
  .trio .p-right{position:absolute; left:50%; margin-left:170px; bottom:20px; transform:rotate(7deg) scale(.86); z-index:2; filter:brightness(.94)}
  .trio .sfx{position:absolute; z-index:5}
  .trio .sfx.s1{left:calc(50% - 560px); top:0; transform:rotate(-8deg)}
  .trio .sfx.s2{right:calc(50% - 560px); top:40px; transform:rotate(7deg)}
  .social-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:22px; margin-top:clamp(48px,6vw,84px)}
  .social-grid .panel{background:var(--paper); color:var(--ink); border-color:var(--paper); box-shadow:8px 8px 0 var(--red); padding:26px 22px 22px; display:flex; flex-direction:column; gap:12px}
  .social-grid h3{font-family:var(--display); font-weight:400; text-transform:uppercase; font-size:26px; line-height:1}
  .social-grid p{color:var(--ink-soft); font-size:14.5px}
  .social-grid .ico{width:44px; height:44px; border:3px solid var(--ink); background:var(--paper-2); display:grid; place-items:center; box-shadow:3px 3px 0 var(--ink)}
  .social-grid .ico svg{width:22px; height:22px; color:var(--red)}
  .safety{margin-top:26px; display:flex; gap:16px; align-items:flex-start; padding:18px 22px; border:3px solid color-mix(in srgb, var(--paper) 35%, transparent); color:color-mix(in srgb, var(--paper) 80%, transparent); font-size:14px; font-weight:600}
  .safety b{color:var(--paper); font-weight:900}
  .safety svg{width:26px; height:26px; flex:none; color:var(--yellow)}
  @media (max-width:1180px){
    .trio .p-left{margin-left:-440px} .trio .p-right{margin-left:140px}
    .trio .sfx.s1{left:12px} .trio .sfx.s2{right:12px}
  }
  @media (max-width:980px){
    .trio{flex-direction:column; align-items:center; gap:28px; min-height:0}
    .trio .p-left,.trio .p-right{position:relative; left:auto; margin-left:0; bottom:auto; filter:none}
    .trio .p-left{transform:rotate(-4deg) scale(.95)} .trio .p-right{transform:rotate(4deg) scale(.95)}
    .social-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:620px){ .social-grid{grid-template-columns:1fr} }

  /* ───────────── Binders ───────────── */
  .binders{padding:clamp(72px,9vw,128px) 0; position:relative; overflow:hidden}
  .binders .wrap{position:relative; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:clamp(32px,5vw,80px); align-items:center}
  .binders h2{font-size:clamp(46px,5.8vw,88px); margin-top:14px; transform:skewX(-6deg); text-shadow:3px 3px 0 var(--paper), 5px 5px 0 var(--ink)}
  .binders .lede{margin-top:22px}
  .steps{list-style:none; padding:0; margin:34px 0 0; display:grid; gap:14px; counter-reset:step}
  .steps li{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:start; counter-increment:step}
  .steps li::before{content:counter(step); font-family:var(--display); font-size:26px; line-height:1; text-align:center; background:var(--red); color:#fff; border:3px solid var(--ink); width:44px; height:44px; display:grid; place-items:center}
  .steps li b{display:block; font-weight:900; font-size:17px; grid-column:2}
  .steps li span{grid-column:2; margin-top:-8px; color:var(--ink-soft); font-size:15px}
  .binder-stage{position:relative; display:flex; justify-content:center; align-items:flex-end; gap:0; min-height:620px}
  .binder-stage .phone.back{position:absolute; left:2%; bottom:8%; transform:rotate(-7deg) scale(.86); z-index:1}
  .binder-stage .phone.front{position:relative; z-index:2; transform:rotate(3deg)}
  .binders .sfx{position:absolute; right:0; top:-26px; z-index:3; transform:rotate(7deg)}
  .binders .panel.note{position:absolute; left:0; bottom:-18px; z-index:3; padding:12px 16px; font-size:13px; font-weight:800; max-width:230px; line-height:1.35; box-shadow:6px 6px 0 var(--red)}
  .binders .panel.note b{color:var(--red)}
  @media (max-width:980px){
    .binders .wrap{grid-template-columns:1fr}
    .binder-stage{min-height:0; margin-top:40px; flex-direction:column; align-items:center; gap:28px}
    .binder-stage .phone.back{position:relative; left:auto; bottom:auto; transform:rotate(-4deg) scale(.95)}
    .binders .panel.note{position:relative; bottom:auto; margin-top:8px}
  }

  /* ───────────── Japanese sets ───────────── */
  .jp{padding:clamp(72px,9vw,120px) 0; border-top:3px solid var(--ink); background:var(--paper-2); position:relative; overflow:hidden}
  .jp .wrap{position:relative; display:grid; grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr); gap:clamp(28px,5vw,72px); align-items:center}
  .jp .kana-big{font-family:var(--body); font-weight:900; font-size:clamp(44px,5.4vw,82px); line-height:1; white-space:nowrap; color:var(--red); letter-spacing:.04em; margin-top:14px; transform:skewX(-6deg); text-shadow:4px 4px 0 var(--paper-2), 7px 7px 0 var(--ink)}
  .jp h2{font-size:clamp(40px,5vw,72px); margin-top:8px; transform:skewX(-6deg); text-shadow:3px 3px 0 var(--paper-2), 5px 5px 0 var(--ink)}
  .jp .lede{margin-top:22px}
  .jp-list{margin:24px 0 0; padding:0; list-style:none; display:grid; gap:10px}
  .jp-list li{display:flex; gap:12px; align-items:flex-start; font-weight:700; font-size:15px}
  .jp-list li::before{content:"JA"; flex:none; font-size:10px; font-weight:900; letter-spacing:.08em; padding:3px 7px; margin-top:3px; background:var(--red); color:#fff; border:2px solid var(--ink)}
  .fan{position:relative; height:clamp(320px,36vw,460px)}
  .fan figure{position:absolute; margin:0; width:clamp(140px,16vw,210px); transition:transform .3s ease}
  .fan figure:hover{z-index:9; transform:translateY(-10px) rotate(0deg) !important}
  .fan img{width:100%; border-radius:10px; border:3px solid var(--ink); box-shadow:var(--shadow-ink-sm); display:block}
  .fan .ja{position:absolute; top:-10px; right:-10px; background:var(--red); color:#fff; font-size:11px; font-weight:900; letter-spacing:.08em; padding:4px 8px; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink)}
  .fan .c1{left:0%;  top:14%; transform:rotate(-12deg); z-index:1}
  .fan .c2{left:17%; top:4%;  transform:rotate(-6deg);  z-index:2}
  .fan .c3{left:35%; top:0%;  transform:rotate(-1deg);  z-index:3}
  .fan .c4{left:53%; top:3%;  transform:rotate(5deg);   z-index:4}
  .fan .c5{left:70%; top:12%; transform:rotate(11deg);  z-index:5}
  .fan .c6{left:28%; top:36%; transform:rotate(-4deg);  z-index:6}
  .jp .sfx{position:absolute; right:0; top:-18px; z-index:7; transform:rotate(7deg)}
  @media (max-width:900px){
    .jp .wrap{grid-template-columns:1fr}
    .fan{height:min(72vw,420px); margin-top:20px}
    .fan figure{width:min(30vw,170px)}
    .fan .c6{left:34%; top:40%}
  }

  /* ───────────── Sync + About ───────────── */
  .duo{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:30px; align-items:stretch}
  .duo .panel{padding:36px}
  .duo h3{font-family:var(--display); font-weight:400; text-transform:uppercase; font-size:clamp(34px,3.6vw,50px); line-height:.95; margin:10px 0 18px; transform:skewX(-5deg)}
  .duo p{color:var(--ink-soft); font-size:16px}
  .duo ul{margin:18px 0 0; padding:0; list-style:none; display:grid; gap:10px}
  .duo li{display:flex; gap:12px; align-items:flex-start; font-weight:700; font-size:15px}
  .duo li::before{content:""; flex:none; width:18px; height:18px; margin-top:4px; border:3px solid var(--ink); background:var(--green); border-radius:50%}
  .duo li.no::before{background:var(--red)}
  .bubble{position:relative; background:var(--paper-2)}
  .bubble::after{content:""; position:absolute; left:52px; bottom:-26px; width:30px; height:30px; background:var(--paper-2); border:3px solid var(--ink); border-top:0; border-left:0; transform:rotate(45deg) skew(10deg,10deg)}
  .author{display:flex; align-items:center; gap:14px; margin-top:26px}
  .author img{width:56px; height:56px; border-radius:50%; border:3px solid var(--ink)}
  .author b{display:block; font-size:16px; font-weight:900}
  .author span{font-size:13px; color:var(--ink-soft); font-weight:700}
  @media (max-width:820px){ .duo{grid-template-columns:1fr} .duo .panel{padding:26px} }

  /* ───────────── Final CTA + footer ───────────── */
  .final{position:relative; overflow:hidden; text-align:center; padding:clamp(80px,10vw,140px) 0; border-top:3px solid var(--ink)}
  .final .burst{position:absolute; inset:-40% -20%; pointer-events:none; opacity:.14; background:repeating-conic-gradient(from 0deg at 50% 50%, var(--red) 0deg 6deg, transparent 6deg 14deg); -webkit-mask:radial-gradient(circle at 50% 50%, #000 20%, transparent 62%); mask:radial-gradient(circle at 50% 50%, #000 20%, transparent 62%)}
  .final .wrap{position:relative}
  .final h2{font-size:clamp(52px,8vw,124px); transform:skewX(-6deg); text-shadow:4px 4px 0 var(--paper), 7px 7px 0 var(--ink); margin:12px 0 22px}
  .final .lede{margin-inline:auto}
  footer{background:var(--ink); color:var(--paper); padding:40px 0 48px; font-size:13px}
  footer .wrap{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:28px; align-items:start}
  footer p{color:color-mix(in srgb, var(--paper) 65%, transparent); max-width:60ch; line-height:1.55}
  footer .fl{display:flex; gap:22px; justify-content:flex-end; flex-wrap:wrap; font-weight:800; text-transform:uppercase; letter-spacing:.08em; font-size:12px}
  footer .fl a{text-decoration:none; color:var(--paper)} footer .fl a:hover{color:var(--yellow)}
  footer .mark{font-family:var(--display); font-size:22px; letter-spacing:.04em; margin-bottom:10px}
  @media (max-width:820px){ footer .wrap{grid-template-columns:1fr} footer .fl{justify-content:flex-start} }

  /* ───────────── Beta form ───────────── */
  .beta-form{display:flex; gap:12px; justify-content:center; align-items:stretch; margin:36px auto 0; max-width:640px}
  .beta-form input[type=email]{flex:1; min-width:0; font:inherit; font-weight:700; font-size:17px; padding:14px 18px; color:var(--ink); background:var(--paper-2); border:3px solid var(--ink); box-shadow:var(--shadow-ink-sm); border-radius:0; outline-offset:3px}
  .beta-form input[type=email]::placeholder{color:var(--tone); font-weight:600}
  .beta-form input[type=email]:focus-visible{outline:3px solid var(--yellow)}
  .beta-form .btn{white-space:nowrap}
  .beta-form .btn[disabled]{opacity:.7; cursor:progress; transform:none}
  .beta-form .hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .beta-status{min-height:1.6em; margin-top:14px; font-weight:800; font-size:15px; color:var(--red)}
  .beta-status.ok{color:var(--green)}
  .beta-fine{margin-top:10px; font-size:13px; font-weight:600; color:var(--ink-soft); line-height:1.6}
  .beta-fine a{color:var(--red); font-weight:800}
  @media (max-width:560px){ .beta-form{flex-direction:column} .beta-form .btn{justify-content:center} }

  /* ───────────── Reveal motion ───────────── */
  .rv{opacity:0; transform:translateY(22px)}
  .rv.in{opacity:1; transform:none; transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}
  .rv.d1.in{transition-delay:.08s} .rv.d2.in{transition-delay:.16s} .rv.d3.in{transition-delay:.24s}
  .hero h1 .line{opacity:0; transform:translateX(-40px) skewX(-6deg); animation:slam .55s cubic-bezier(.2,.8,.2,1) forwards}
  .hero h1 .line:nth-child(2){animation-delay:.12s}
  @keyframes slam{to{opacity:1; transform:none}}
  .hero-stage .phone{animation:rise .9s cubic-bezier(.2,.8,.2,1) .2s both}
  @keyframes rise{from{opacity:0; transform:translateY(60px) rotate(-2deg)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){
    .rv{opacity:1; transform:none}
    .hero h1 .line, .hero-stage .phone{animation:none; opacity:1; transform:none}
    .ticker .track{animation:none}
    html{scroll-behavior:auto}
  }

  /* ═══════════════════════════════════════════════════════════
     Device mockups — mirror the app's Theme.swift. Literal colors on
     purpose: these depict the app's own light and dark appearances.
     Everything inside .screen reads from the --p/--i tokens below.
     ═══════════════════════════════════════════════════════════ */
  .phone{
    position:relative; width:300px; aspect-ratio:300/648; flex:none;
    background:#0d0d0f; border-radius:50px; padding:10px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.55), 0 0 0 2px #2b2b30 inset, 0 0 0 3px #121114;
    font-family:var(--body); text-align:left; line-height:1.25;
  }
  .phone::before,.phone::after{content:""; position:absolute; background:#2b2b30; border-radius:2px}
  .phone::before{left:-3px; top:120px; width:3px; height:64px}
  .phone::after{right:-3px; top:150px; width:3px; height:88px}
  .screen{
    --p:#F2F3EF; --p2:#FFFFFF; --i:#121114; --is:#4A484E; --t2:#DDDFD8; --r:#AC322F; --g:#2FA44F; --b:#2E5AAC; --y:#F7C728;
    position:absolute; inset:10px; border-radius:41px; overflow:hidden; background:var(--p); color:var(--i);
  }
  .screen.dark{--p:#131316; --p2:#1B1B1F; --i:#F1F0EA; --is:#B8B6BE; --t2:#2A2A2F; --r:#E0463F; --g:#43C06A; --b:#5B86D6}
  .island{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:82px; height:24px; background:#0d0d0f; border-radius:14px; z-index:6}
  .status{height:44px; display:flex; align-items:center; justify-content:space-between; padding:14px 22px 0; font-size:11px; font-weight:800}
  .status .r{display:flex; gap:5px; align-items:center}
  .status svg{width:14px; height:11px; fill:var(--i)}
  .status .bat{fill:none; stroke:var(--i)}
  .home-bar{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:96px; height:4px; border-radius:99px; background:var(--i); opacity:.7; z-index:6}
  .sec{color:var(--is)}
  .acc{color:var(--r)}
  /* newsprint primitives */
  .mp{background:var(--p2); border:2px solid var(--i); box-shadow:2px 2px 0 var(--i)}
  .mp.flat{box-shadow:none} .mp.thin{border-width:1px}
  .circ{width:35px; height:35px; border-radius:50%; display:grid; place-items:center; position:relative; flex:none; background:var(--p2); border:2px solid var(--i); box-shadow:2px 2px 0 var(--i)}
  .circ svg{width:16px; height:16px; color:var(--r)}
  .circ.ink svg{color:var(--i)}
  .badge{position:absolute; top:-4px; right:-5px; background:var(--r); color:#fff; font-size:8px; font-weight:900; padding:1px 4px; border-radius:99px; border:1.5px solid var(--p2)}
  .av{border-radius:50%; display:grid; place-items:center; font-weight:900; color:#fff; border:2px solid var(--i); flex:none; font-size:12px; width:35px; height:35px}
  .card-img{aspect-ratio:0.716; border-radius:9px; overflow:hidden; background:var(--p2)}
  .card-img img{width:100%; height:100%; object-fit:cover}
  .wordmark{font-family:var(--display); font-size:15px; letter-spacing:.03em; color:var(--i); text-shadow:1.5px 1.5px 0 var(--r); transform:skewX(-6deg); display:inline-block}

  /* Home */
  .hdr{display:flex; gap:9px; align-items:center; padding:4px 15px 8px}
  .prog{flex:1; height:35px; border-radius:15px; display:flex; align-items:center; gap:8px; padding:0 12px; font-variant-numeric:tabular-nums}
  .prog b{font-size:13px; font-weight:900}
  .prog .bar{flex:1; height:6px; border-radius:99px; background:color-mix(in srgb, var(--i) 10%, transparent); overflow:hidden}
  .prog .bar i{display:block; width:42%; height:100%; background:var(--r); border-radius:99px}
  .prog small{font-size:9px; font-weight:700}
  .fbar{display:flex; gap:7px; align-items:center; padding:2px 15px 12px}
  .fchip{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; padding:6px 9px; border-radius:99px; position:relative}
  .fchip svg{width:9px; height:9px}
  .fchip .chev{width:7px; height:7px; opacity:.7}
  .fbar .sp{flex:1}
  .ficon{width:26px; height:26px; border-radius:99px; display:grid; place-items:center; position:relative}
  .ficon svg{width:11px; height:11px}
  .seg{display:flex; gap:1px; padding:1.5px; border-radius:99px}
  .seg span{width:24px; height:21px; border-radius:99px; display:grid; place-items:center; color:var(--is)}
  .seg span.on{background:var(--r); color:#fff}
  .seg svg{width:9px; height:9px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:15px; padding:0 15px}
  .tile{display:flex; flex-direction:column; gap:6px; align-items:center}
  .tile .card-img{position:relative; width:100%; box-shadow:2px 2px 0 var(--i)}
  .tile .dex{position:absolute; top:6px; left:6px; background:rgba(0,0,0,.45); color:#fff; font-size:8px; font-weight:800; padding:2px 6px; border-radius:99px; font-variant-numeric:tabular-nums}
  .tile .caught{position:absolute; right:6px; bottom:6px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center}
  .tile .caught svg{width:19px; height:19px; color:#fff}
  .tile .caught.yes svg{color:#34C759}
  .tile .name{font-size:11px; font-weight:800}
  .tile .card-img.gray img{filter:grayscale(1); opacity:.85}
  .search{position:absolute; left:15px; right:15px; bottom:18px; height:38px; border-radius:99px; display:flex; align-items:center; gap:9px; padding:0 15px; font-size:11px; font-weight:600; color:var(--is)}
  .search svg{width:13px; height:13px}
  .cam{position:absolute; right:15px; bottom:66px; z-index:2}
  .fade{position:absolute; left:0; right:0; bottom:0; height:90px; background:linear-gradient(transparent, var(--p) 70%); pointer-events:none}

  /* Nav bar (pushed screens) */
  .navbar{display:flex; align-items:center; justify-content:space-between; padding:6px 15px 10px; font-size:11px; font-weight:700}
  .navbar .t{font-weight:800; font-size:12px}
  .navbar .acc{display:inline-flex; align-items:center; gap:3px}
  .navbar svg{width:14px; height:14px}
  .pad{padding:0 15px}

  /* Card detail */
  .cd{display:flex; flex-direction:column; align-items:center; gap:9px}
  .cd-img{width:168px; border-radius:13px; overflow:hidden; border:2px solid var(--i); box-shadow:3px 3px 0 var(--i)}
  .cd-title{text-align:center}
  .cd-title b{font-size:12px; font-weight:800; display:block}
  .cd-tags{display:flex; gap:5px; justify-content:center; margin-top:4px}
  .cd-tags span{font-size:8.5px; font-weight:700; color:var(--is); border:1px solid var(--i); padding:2px 8px; border-radius:99px}
  .cd-price{width:100%; border-radius:15px; padding:10px 12px; text-align:center}
  .cd-price small{font-size:8.5px; font-weight:700; display:block}
  .cd-big{font-size:26px; font-weight:900; color:var(--g); line-height:1.1; font-variant-numeric:tabular-nums}
  .cd-row{display:flex; justify-content:space-around; margin-top:8px}
  .cd-row b{display:block; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums}
  .cd-actions{display:flex; gap:6px; width:100%}
  .cd-actions span{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:8px; font-weight:800; padding:8px 2px; border-radius:9px}
  .cd-actions svg{width:14px; height:14px}
  .cd-actions .g{color:var(--g); background:color-mix(in srgb, var(--g) 12%, transparent)} .cd-actions .g.on{background:var(--g); color:#fff}
  .cd-actions .b{color:var(--b); background:color-mix(in srgb, var(--b) 12%, transparent)}
  .cd-actions .o{color:#F08A24; background:rgba(240,138,36,.12)} .cd-actions .o.on{background:#F08A24; color:#fff}
  .cd-actions .k{color:var(--i); background:color-mix(in srgb, var(--i) 8%, transparent)}

  /* Binder detail */
  .plabel{font-size:9px; font-weight:800; margin:6px 0 8px}
  .page{border-radius:15px; padding:11px}
  .slots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .slot{aspect-ratio:0.716; border-radius:8px; position:relative}
  .slot img{width:100%; height:100%; object-fit:cover; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,.25)}
  .slot.empty{background:color-mix(in srgb, var(--i) 4%, transparent); border:1.5px dashed var(--t2); display:grid; place-items:center; color:var(--is)}
  .slot.empty svg{width:14px; height:14px}
  .slot.target{outline:2.5px solid var(--r); outline-offset:-1px; border-radius:8px}
  .slot.drag img{position:absolute; inset:0; transform:translate(-26px,-30px) rotate(-7deg) scale(1.1); box-shadow:0 18px 28px rgba(0,0,0,.55); z-index:4; opacity:.96}
  .slot.drag::before{content:""; position:absolute; inset:0; border-radius:8px; background:color-mix(in srgb, var(--i) 4%, transparent); border:1.5px dashed var(--t2)}
  .slot.gray img{filter:grayscale(1); opacity:.8}
  .addpage{margin:15px 0 0; height:34px; border-radius:9px; background:color-mix(in srgb, var(--r) 16%, transparent); color:var(--r); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:6px}
  .addpage svg{width:12px; height:12px}

  /* Profile */
  .acct{display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0 12px}
  .acct .av{width:58px; height:58px; font-size:20px; box-shadow:2px 2px 0 var(--i)}
  .acct b{font-family:var(--display); font-size:18px; margin-top:6px; letter-spacing:.02em}
  .acct small{font-size:9px; font-weight:700}
  .stiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 15px}
  .stile{border-radius:13px; padding:10px; display:flex; flex-direction:column; gap:3px; position:relative}
  .stile svg{width:15px; height:15px; color:var(--r)}
  .stile b{font-size:11px; font-weight:900; margin-top:4px}
  .stile small{font-size:8.5px; font-weight:600}
  .stile .badge{top:8px; right:8px}
  .rowlink{margin:10px 15px 15px; border-radius:13px; padding:9px 11px; display:flex; gap:8px; align-items:center}
  .rowlink svg{width:15px; height:15px; color:var(--r); flex:none}
  .rowlink b{display:block; font-size:11px; font-weight:900}
  .rowlink small{font-size:8.5px; font-weight:600}
  .rowlink .chev{margin-left:auto; color:var(--is); width:9px; height:9px}
  .bhead{display:flex; align-items:center; justify-content:space-between; padding:0 15px 8px}
  .bhead b{font-family:var(--display); font-size:15px; letter-spacing:.02em}
  .bhead span{font-size:10px; font-weight:800; color:var(--r); display:inline-flex; align-items:center; gap:3px}
  .bhead svg{width:9px; height:9px}
  .btiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 15px}
  .btile{border-radius:13px; padding:8px; display:flex; flex-direction:column; gap:3px}
  .thumb{display:grid; gap:2px; padding:5px; border-radius:8px; background:color-mix(in srgb, var(--i) 5%, transparent)}
  .thumb.g3{grid-template-columns:repeat(3,1fr)} .thumb.g2{grid-template-columns:repeat(2,1fr)} .thumb.g4{grid-template-columns:repeat(4,1fr)}
  .thumb i{display:block; aspect-ratio:0.716; border-radius:2px; background:color-mix(in srgb, var(--i) 6%, transparent); overflow:hidden}
  .thumb i img{width:100%; height:100%; object-fit:cover}
  .thumb i.gray img{filter:grayscale(1); opacity:.75}
  .btile b{font-size:10px; font-weight:800; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .btile small{font-size:8.5px; font-weight:600}

  /* Chat */
  .chat{display:flex; flex-direction:column; gap:7px; padding:4px 15px 0}
  .msg{max-width:78%; font-size:10.5px; font-weight:600; padding:8px 11px; border-radius:16px; line-height:1.35}
  .msg.them{align-self:flex-start; background:var(--p2); border:1px solid var(--i)}
  .msg.me{align-self:flex-end; background:var(--r); color:#fff}
  .att{align-self:flex-start; border-radius:14px; padding:8px; border:1px solid var(--i); background:var(--p2); display:flex; gap:8px; align-items:center}
  .att.me{align-self:flex-end}
  .att img{width:64px; border-radius:6px}
  .att b{display:block; font-size:10px; font-weight:800}
  .att small{display:block; font-size:9px; font-weight:800; color:var(--g)}
  .att .sub{color:var(--is); font-weight:600}
  .att .bth{width:30px; height:42px; border-radius:5px; overflow:hidden; background:color-mix(in srgb, var(--i) 6%, transparent)}
  .att .bth img{width:100%; height:100%; object-fit:cover; border-radius:0}
  .att .chev{width:9px; height:9px; color:var(--is)}
  .when{align-self:center; font-size:8.5px; font-weight:700; color:var(--is); margin:2px 0}
  .composer{position:absolute; left:0; right:0; bottom:0; padding:10px 15px 22px; background:var(--p); border-top:1px solid var(--t2); display:flex; gap:8px; align-items:center}
  .composer .field{flex:1; height:32px; border-radius:11px; display:flex; align-items:center; padding:0 10px; font-size:10.5px; color:var(--is); font-weight:600}
  .composer svg{width:24px; height:24px; color:var(--r); flex:none}

  /* Trades */
