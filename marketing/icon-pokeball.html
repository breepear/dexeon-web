<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dexeon app icon</title>
<style>
  /* 1024 x 1024, square. iOS applies its own corner mask, so nothing important
     sits within ~90px of a corner. Palette matches the landing page. */
  :root{ --paper:#F2F3EF; --ink:#121114; --red:#C8322E; --tone:#B9BCB5; }
  html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
  body{background:var(--paper);position:relative}
  .halft{position:absolute;inset:0;
    background-image:radial-gradient(var(--tone) 2.6px, transparent 3.2px);
    background-size:22px 22px;opacity:.85}
  .speed{position:absolute;inset:-10%;opacity:.32;
    background:repeating-conic-gradient(from 0deg at 50% 50%, var(--ink) 0deg .6deg, transparent .6deg 6deg);
    -webkit-mask:radial-gradient(circle at 50% 50%, transparent 38%, #000 47%, #000 66%, transparent 78%);
            mask:radial-gradient(circle at 50% 50%, transparent 38%, #000 47%, #000 66%, transparent 78%)}
  .frame{position:absolute;inset:84px;border:26px solid var(--ink);
    box-shadow:inset 0 0 0 10px var(--paper), inset 0 0 0 16px var(--ink)}
  svg{position:absolute;left:0;top:0}
</style>
</head>
<body>
  <div class="halft"></div>
  <div class="speed"></div>
  <div class="frame"></div>

  <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Screentone for the red half: ink dots that thicken toward the bottom edge -->
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
        <circle cx="13" cy="13" r="6.5" fill="#121114"/>
      </pattern>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
      </linearGradient>
      <!-- mask lives in the ball's local coordinates: red half spans y -340..0 -->
      <mask id="toneMask" maskUnits="userSpaceOnUse" x="-340" y="-340" width="680" height="340">
        <rect x="-340" y="-340" width="680" height="340" fill="url(#fade)"/>
      </mask>
      <clipPath id="ball"><circle cx="0" cy="0" r="330"/></clipPath>
    </defs>

    <!-- The ball, tilted like a thrown Pokéball -->
    <g transform="translate(520 520) rotate(-14)">
      <!-- hard ink drop shadow -->
      <circle cx="30" cy="30" r="352" fill="#121114"/>

      <!-- ink outline -->
      <circle cx="0" cy="0" r="352" fill="#121114"/>

      <!-- body -->
      <g clip-path="url(#ball)">
        <rect x="-340" y="-340" width="680" height="340" fill="#C8322E"/>
        <rect x="-340" y="0" width="680" height="340" fill="#F2F3EF"/>
        <!-- screentone on the red half -->
        <g mask="url(#toneMask)">
          <rect x="-340" y="-340" width="680" height="340" fill="url(#dots)" opacity=".45"/>
        </g>
        <!-- soft grey tone on the white half, bottom -->
        <rect x="-340" y="200" width="680" height="140" fill="url(#dots)" opacity=".18"/>
        <!-- manga gloss highlight -->
        <path d="M-215 -150 A 265 265 0 0 1 -60 -262" fill="none" stroke="#F2F3EF" stroke-width="30" stroke-linecap="round"/>
        <path d="M-262 -70 A 272 272 0 0 1 -248 -110" fill="none" stroke="#F2F3EF" stroke-width="22" stroke-linecap="round"/>
        <!-- centre band -->
        <rect x="-340" y="-22" width="680" height="44" fill="#121114"/>
      </g>

      <!-- button -->
      <circle cx="0" cy="0" r="112" fill="#121114"/>
      <circle cx="0" cy="0" r="78" fill="#F2F3EF"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#121114" stroke-width="16"/>
      <circle cx="-22" cy="-22" r="10" fill="#F2F3EF"/>
    </g>
  </svg>
</body>
</html>
