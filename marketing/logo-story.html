<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dexeon logo story</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=M+PLUS+Rounded+1c:wght@700;900&display=swap">
<style>
  /* 1080 x 1920 Instagram Story. Every element is a CSS animation on a shared
     7-second timeline; logo-story.py freezes the page at ?t=<seconds> and
     screenshots one frame at a time, then ffmpeg stitches the frames to MP4. */
  :root{--paper:#131316;--paper2:#1B1B1F;--ink:#F1F0EA;--ink-soft:#B8B6BE;--tone:#2A2A2F;--red:#E0463F;--yellow:#F7C728;
        --display:'Anton',Impact,sans-serif;--body:'M PLUS Rounded 1c',system-ui,sans-serif}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body)}
  .shot{position:relative;width:1080px;height:1920px;overflow:hidden}
  .halft{position:absolute;inset:0;background-image:radial-gradient(#2c2c31 2.2px,transparent 3px);background-size:22px 22px;opacity:.9}
  .kana{position:absolute;left:-80px;top:-60px;font-size:560px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:3px #2a2a30;white-space:nowrap;letter-spacing:-.04em;
        animation:drift 7s linear both}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-140px)}}
  .speed{position:absolute;inset:-25%;opacity:0;
        background:repeating-conic-gradient(from 0deg at 50% 36%, var(--ink) 0deg .7deg, transparent .7deg 5deg);
        -webkit-mask:radial-gradient(circle at 50% 36%, transparent 14%, #000 30%, #000 70%, transparent 88%);
                mask:radial-gradient(circle at 50% 36%, transparent 14%, #000 30%, #000 70%, transparent 88%);
        animation:burst .45s cubic-bezier(.2,.8,.2,1) .35s both, spin 7s linear both}
  @keyframes burst{from{opacity:0;transform:scale(.6)}to{opacity:.16;transform:scale(1)}}
  @keyframes spin{from{rotate:0deg}to{rotate:6deg}}

  .mark{position:absolute;left:50%;top:440px;width:400px;height:400px;margin-left:-200px;border-radius:22%;border:12px solid var(--ink);
        background:#121114 url(../assets/app-icon-dark.png) center/cover;box-shadow:0 0 0 var(--ink);opacity:0;
        animation:slam .6s cubic-bezier(.16,1.1,.3,1) .5s both, shadow .3s ease-out 1.0s both}
  @keyframes slam{0%{opacity:0;transform:scale(5) rotate(-18deg)}35%{opacity:1}55%{transform:scale(.9) rotate(4deg)}78%{transform:scale(1.07) rotate(-1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes shadow{from{box-shadow:0 0 0 var(--ink)}to{box-shadow:24px 24px 0 var(--ink)}}
  .flash{position:absolute;left:50%;top:640px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;border:26px solid var(--ink);opacity:0;
        animation:ring .55s cubic-bezier(.1,.7,.3,1) .95s forwards}
  @keyframes ring{0%{opacity:.85;transform:scale(.25)}100%{opacity:0;transform:scale(1.5)}}
  .sfx{position:absolute;right:120px;top:340px;font-family:'Bangers',var(--display);font-size:104px;letter-spacing:.04em;color:#121114;background:var(--yellow);
        border:8px solid #121114;box-shadow:14px 14px 0 var(--ink);padding:14px 40px 8px;transform-origin:center;
        animation:pop .45s cubic-bezier(.2,1.4,.4,1) 1.02s both}
  @keyframes pop{0%{opacity:0;transform:scale(0) rotate(-40deg)}60%{opacity:1;transform:scale(1.22) rotate(-4deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}

  .wm{position:absolute;left:50%;top:980px;width:760px;margin-left:-380px;
        animation:wipe .65s cubic-bezier(.2,.8,.2,1) 1.85s both}
  .wm img{width:100%;display:block}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0);transform:translateX(-50px)}to{clip-path:inset(0 -2% 0 0);transform:translateX(0)}}
  .bar{position:absolute;left:50%;top:1400px;width:420px;height:16px;margin-left:-210px;background:var(--red);border:4px solid #121114;transform-origin:left center;
        animation:grow .4s cubic-bezier(.2,.9,.2,1) 2.35s both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .tag{position:absolute;left:0;right:0;top:1440px;text-align:center;font-family:var(--display);font-size:150px;line-height:1;text-transform:uppercase;
        transform:skewX(-6deg);text-shadow:8px 8px 0 var(--paper),16px 16px 0 var(--red);
        animation:rise .55s cubic-bezier(.2,1.2,.3,1) 2.8s both}
  .tag .red{color:var(--red);text-shadow:8px 8px 0 var(--paper),16px 16px 0 var(--ink)}
  @keyframes rise{from{opacity:0;transform:skewX(-6deg) translateY(110px)}to{opacity:1;transform:skewX(-6deg) translateY(0)}}
  .eyebrow{position:absolute;left:0;right:0;top:1625px;text-align:center;font-size:30px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft);
        animation:fade .4s ease-out 3.3s both}
  .eyebrow::before,.eyebrow::after{content:"";display:inline-block;width:70px;height:8px;background:var(--red);vertical-align:middle;margin:0 24px}
  @keyframes fade{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  .pill{position:absolute;left:50%;top:1705px;transform:translateX(-50%);background:var(--ink);color:#121114;font-weight:900;font-size:34px;letter-spacing:.08em;
        padding:22px 48px;border:5px solid #121114;box-shadow:12px 12px 0 var(--red);white-space:nowrap;
        animation:pillpop .5s cubic-bezier(.2,1.4,.4,1) 3.8s both}
  @keyframes pillpop{0%{opacity:0;transform:translateX(-50%) scale(.5)}65%{opacity:1;transform:translateX(-50%) scale(1.08)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
</style>
</head>
<body>
<div class="shot">
  <div class="halft"></div>
  <div class="kana" aria-hidden="true">デクセオン</div>
  <div class="speed"></div>
  <div class="flash"></div>
  <div class="mark"></div>
  <div class="sfx">ドン!</div>
  <div class="wm"><img src="../assets/logo/dexeon-wordmark-nav-dark.png" alt="Dexeon"></div>
  <div class="bar"></div>
  <div class="tag">Track <span class="red">’Em All.</span></div>
  <div class="eyebrow">Now in beta · iPhone</div>
  <div class="pill">dexeontcg.com</div>
</div>
<script>
  // Freeze the whole timeline at ?t=<seconds> so headless Chrome can capture a frame.
  var m = location.search.match(/[?&]t=([\d.]+)/);
  if (m) {
    var t = parseFloat(m[1]) * 1000;
    document.body.offsetWidth; // flush styles so every CSS animation exists
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t; });
  }
</script>
</body>
</html>
