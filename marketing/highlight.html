<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dexeon highlight covers</title>
<script>
  // Pick the glyph with ?v=about | binders | trades | beta | scan | prices | leaders (default: about).
  var v = (location.search.match(/v=(\w+)/) || [])[1] || 'about';
  document.documentElement.dataset.v = v;
</script>
<style>
  /* 1080 x 1080. Instagram crops highlight covers to a circle, so everything
     that matters lives inside the centered disc. No letters anywhere. */
  :root{ --paper:#F2F3EF; --paper2:#FFFFFF; --ink:#121114; --red:#C8322E; --tone:#B9BCB5; --yellow:#F7C728; --blue:#2E5AAC; --green:#2FA44F; }
  html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
  body{background:var(--paper);position:relative}
  .halft{position:absolute;inset:0;background-image:radial-gradient(var(--tone) 2.4px, transparent 3px);background-size:22px 22px;opacity:.7}
  .speed{position:absolute;inset:-10%;opacity:.22;
    background:repeating-conic-gradient(from 0deg at 50% 50%, var(--ink) 0deg .6deg, transparent .6deg 6deg);
    -webkit-mask:radial-gradient(circle at 50% 50%, transparent 40%, #000 52%, #000 70%, transparent 82%);
            mask:radial-gradient(circle at 50% 50%, transparent 40%, #000 52%, #000 70%, transparent 82%)}
  .disc{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;
    background:var(--paper2);border:16px solid var(--ink);box-shadow:inset 0 0 0 12px var(--paper2), inset 0 0 0 20px var(--ink), 22px 22px 0 var(--ink)}
  svg{position:absolute;left:0;top:0}
  svg g.v{display:none}
  :root[data-v="about"]   g.about{display:block}
  :root[data-v="binders"] g.binders{display:block}
  :root[data-v="trades"]  g.trades{display:block}
  :root[data-v="beta"]    g.beta{display:block}
  :root[data-v="scan"]    g.scan{display:block}
  :root[data-v="prices"]  g.prices{display:block}
  :root[data-v="leaders"] g.leaders{display:block}
</style>
</head>
<body>
  <div class="halft"></div>
  <div class="speed"></div>
  <div class="disc"></div>
  <svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">

    <!-- ABOUT: one trading card + caught ring -->
    <g class="v about">
      <g transform="translate(540 520) rotate(-9)">
        <rect x="-146" y="-206" width="300" height="420" rx="26" fill="#121114"/>
        <rect x="-172" y="-232" width="300" height="420" rx="26" fill="#C8322E" stroke="#121114" stroke-width="16"/>
        <rect x="-156" y="-216" width="268" height="388" rx="18" fill="none" stroke="#F2F3EF" stroke-width="7"/>
        <rect x="-126" y="-176" width="208" height="180" rx="12" fill="#F2F3EF" stroke="#121114" stroke-width="10"/>
        <path d="M-116 -20 C -70 -90, -20 -70, 20 -40 C 50 -20, 60 -60, 72 -70 L 72 -6 L -116 -6 Z" fill="#B9BCB5" opacity=".55"/>
        <circle cx="30" cy="-120" r="26" fill="#F7C728" stroke="#121114" stroke-width="8"/>
        <rect x="-126" y="36" width="150" height="22" rx="11" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
        <rect x="-126" y="86" width="208" height="22" rx="11" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
        <rect x="-126" y="136" width="120" height="22" rx="11" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
      </g>
      <g transform="translate(730 690)">
        <circle r="78" fill="#121114"/>
        <circle cx="-10" cy="-10" r="78" fill="#2FA44F" stroke="#121114" stroke-width="14"/>
        <path d="M-44 -6 l26 26 l52 -56" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10 -10)"/>
      </g>
    </g>

    <!-- BINDERS: a 3x3 pocket page with binder rings, one pocket being filled -->
    <g class="v binders">
      <g transform="translate(540 540) rotate(-6)">
        <rect x="-214" y="-244" width="450" height="500" rx="28" fill="#121114"/>
        <rect x="-240" y="-270" width="450" height="500" rx="28" fill="#F2F3EF" stroke="#121114" stroke-width="16"/>
        <!-- rings -->
        <g fill="none" stroke="#121114" stroke-width="14">
          <circle cx="-240" cy="-150" r="30" fill="#F2F3EF"/><circle cx="-240" cy="-20" r="30" fill="#F2F3EF"/><circle cx="-240" cy="110" r="30" fill="#F2F3EF"/>
        </g>
        <!-- pockets: 3 x 3 -->
        <g stroke="#121114" stroke-width="9">
          <rect x="-182" y="-222" width="110" height="146" rx="10" fill="#C8322E"/>
          <rect x="-56"  y="-222" width="110" height="146" rx="10" fill="#2E5AAC"/>
          <rect x="70"   y="-222" width="110" height="146" rx="10" fill="#F7C728"/>
          <rect x="-182" y="-58"  width="110" height="146" rx="10" fill="#2FA44F"/>
          <rect x="-56"  y="-58"  width="110" height="146" rx="10" fill="#C8322E"/>
          <rect x="70"   y="-58"  width="110" height="146" rx="10" fill="#B9BCB5"/>
          <rect x="-182" y="106"  width="110" height="120" rx="10" fill="#F7C728"/>
          <rect x="-56"  y="106"  width="110" height="120" rx="10" fill="none" stroke-dasharray="18 12"/>
          <rect x="70"   y="106"  width="110" height="120" rx="10" fill="none" stroke-dasharray="18 12"/>
        </g>
        <!-- little art windows so the pockets read as cards -->
        <g fill="#F2F3EF" opacity=".9">
          <rect x="-166" y="-206" width="78" height="60" rx="6"/><rect x="-40" y="-206" width="78" height="60" rx="6"/><rect x="86" y="-206" width="78" height="60" rx="6"/>
          <rect x="-166" y="-42" width="78" height="60" rx="6"/><rect x="-40" y="-42" width="78" height="60" rx="6"/><rect x="86" y="-42" width="78" height="60" rx="6"/>
          <rect x="-166" y="122" width="78" height="60" rx="6"/>
        </g>
      </g>
      <!-- the card being dropped in -->
      <g transform="translate(700 710) rotate(12)">
        <rect x="-52" y="-72" width="128" height="170" rx="12" fill="#121114"/>
        <rect x="-64" y="-84" width="128" height="170" rx="12" fill="#C8322E" stroke="#121114" stroke-width="12"/>
        <rect x="-44" y="-64" width="88" height="70" rx="7" fill="#F2F3EF"/>
      </g>
    </g>

    <!-- TRADES: two cards swapping, with a circular arrows loop -->
    <g class="v trades">
      <g transform="translate(400 470) rotate(-14)">
        <rect x="-96" y="-136" width="220" height="300" rx="20" fill="#121114"/>
        <rect x="-116" y="-156" width="220" height="300" rx="20" fill="#C8322E" stroke="#121114" stroke-width="14"/>
        <rect x="-104" y="-144" width="196" height="276" rx="14" fill="none" stroke="#F2F3EF" stroke-width="6"/>
        <rect x="-82" y="-122" width="152" height="120" rx="10" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
        <rect x="-82" y="24" width="120" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
        <rect x="-82" y="64" width="152" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
      </g>
      <g transform="translate(690 610) rotate(12)">
        <rect x="-96" y="-136" width="220" height="300" rx="20" fill="#121114"/>
        <rect x="-116" y="-156" width="220" height="300" rx="20" fill="#2E5AAC" stroke="#121114" stroke-width="14"/>
        <rect x="-104" y="-144" width="196" height="276" rx="14" fill="none" stroke="#F2F3EF" stroke-width="6"/>
        <rect x="-82" y="-122" width="152" height="120" rx="10" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
        <rect x="-82" y="24" width="120" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
        <rect x="-82" y="64" width="152" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
      </g>
      <!-- swap arrows -->
      <g fill="none" stroke="#121114" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
        <path d="M540 300 A 250 250 0 0 1 800 420"/>
        <path d="M540 780 A 250 250 0 0 1 280 660"/>
      </g>
      <g fill="none" stroke="#F7C728" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <path d="M540 300 A 250 250 0 0 1 800 420"/>
        <path d="M540 780 A 250 250 0 0 1 280 660"/>
      </g>
      <g fill="#F7C728" stroke="#121114" stroke-width="12" stroke-linejoin="round">
        <path d="M800 420 l-70 -14 l14 74 z" transform="translate(6 -6)"/>
        <path d="M280 660 l70 14 l-14 -74 z" transform="translate(-6 6)"/>
      </g>
    </g>

    <!-- BETA: a paper plane on a rising path with a burst -->
    <g class="v beta">
      <!-- dotted path -->
      <path d="M230 790 C 320 730, 360 650, 440 600" fill="none" stroke="#121114" stroke-width="14" stroke-linecap="round" stroke-dasharray="4 40"/>
      <!-- burst -->
      <g transform="translate(730 340) scale(.9)">
        <path d="M0 -120 L26 -40 L110 -60 L50 0 L110 60 L26 40 L0 120 L-26 40 L-110 60 L-50 0 L-110 -60 L-26 -40 Z" fill="#F7C728" stroke="#121114" stroke-width="12" stroke-linejoin="round" transform="rotate(12)"/>
      </g>
      <!-- plane -->
      <g transform="translate(520 600) rotate(-28) scale(.92)">
        <path d="M-200 40 L200 -60 L-40 160 Z" fill="#121114" transform="translate(22 22)"/>
        <path d="M-200 40 L200 -60 L-40 160 Z" fill="#F2F3EF" stroke="#121114" stroke-width="16" stroke-linejoin="round"/>
        <path d="M-200 40 L200 -60 L-30 60 Z" fill="#C8322E" stroke="#121114" stroke-width="16" stroke-linejoin="round"/>
        <path d="M-30 60 L-40 160 L10 90 Z" fill="#B9BCB5" stroke="#121114" stroke-width="12" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- SCAN: a card inside a camera viewfinder, corner brackets + a red scan line -->
    <g class="v scan">
      <!-- the card, slightly tilted -->
      <g transform="translate(540 540) rotate(-8)">
        <rect x="-126" y="-176" width="260" height="360" rx="22" fill="#121114"/>
        <rect x="-146" y="-196" width="260" height="360" rx="22" fill="#C8322E" stroke="#121114" stroke-width="14"/>
        <rect x="-132" y="-182" width="232" height="332" rx="16" fill="none" stroke="#F2F3EF" stroke-width="6"/>
        <rect x="-106" y="-150" width="180" height="150" rx="10" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
        <path d="M-96 -30 C -60 -90, -20 -70, 10 -40 C 40 -20, 50 -60, 64 -70 L 64 -10 L -96 -10 Z" fill="#B9BCB5" opacity=".55"/>
        <circle cx="30" cy="-100" r="22" fill="#F7C728" stroke="#121114" stroke-width="7"/>
        <rect x="-106" y="26" width="130" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
        <rect x="-106" y="70" width="180" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
        <rect x="-106" y="114" width="100" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
      </g>
      <!-- viewfinder brackets -->
      <g fill="none" stroke="#121114" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
        <path d="M300 400 L300 300 L400 300"/>
        <path d="M680 300 L780 300 L780 400"/>
        <path d="M780 680 L780 780 L680 780"/>
        <path d="M400 780 L300 780 L300 680"/>
      </g>
      <g fill="none" stroke="#F7C728" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M300 400 L300 300 L400 300"/>
        <path d="M680 300 L780 300 L780 400"/>
        <path d="M780 680 L780 780 L680 780"/>
        <path d="M400 780 L300 780 L300 680"/>
      </g>
      <!-- scan line -->
      <rect x="250" y="520" width="580" height="30" rx="15" fill="#121114" transform="translate(10 10)"/>
      <rect x="250" y="520" width="580" height="30" rx="15" fill="#2FA44F" stroke="#121114" stroke-width="10"/>
      <!-- match tick -->
      <g transform="translate(760 760)">
        <circle r="66" fill="#121114"/>
        <circle cx="-8" cy="-8" r="66" fill="#2FA44F" stroke="#121114" stroke-width="12"/>
        <path d="M-36 -4 l22 22 l44 -48" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" transform="translate(-8 -8)"/>
      </g>
    </g>

    <!-- PRICES: a card with a chart line climbing off it, price tag on top -->
    <g class="v prices">
      <!-- card, lying back-left -->
      <g transform="translate(430 600) rotate(-12)">
        <rect x="-116" y="-156" width="240" height="330" rx="20" fill="#121114"/>
        <rect x="-136" y="-176" width="240" height="330" rx="20" fill="#2E5AAC" stroke="#121114" stroke-width="14"/>
        <rect x="-122" y="-162" width="212" height="302" rx="14" fill="none" stroke="#F2F3EF" stroke-width="6"/>
        <rect x="-98" y="-134" width="164" height="134" rx="10" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
        <rect x="-98" y="24" width="120" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
        <rect x="-98" y="66" width="164" height="18" rx="9" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
      </g>
      <!-- chart bars behind the line -->
      <g stroke="#121114" stroke-width="10">
        <rect x="560" y="640" width="70" height="140" rx="10" fill="#B9BCB5"/>
        <rect x="650" y="560" width="70" height="220" rx="10" fill="#B9BCB5"/>
        <rect x="740" y="480" width="70" height="300" rx="10" fill="#F7C728"/>
      </g>
      <!-- climbing line with arrow head -->
      <path d="M330 720 L470 640 L560 680 L660 540 L770 470" fill="none" stroke="#121114" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(8 8)"/>
      <path d="M330 720 L470 640 L560 680 L660 540 L770 470" fill="none" stroke="#2FA44F" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(778 466) rotate(-32.5)">
        <path d="M-34 -44 L58 0 L-34 44 Z" fill="#121114" transform="translate(8 8)"/>
        <path d="M-34 -44 L58 0 L-34 44 Z" fill="#2FA44F" stroke="#121114" stroke-width="12" stroke-linejoin="round"/>
      </g>
      <!-- hanging price tag (blank) -->
      <g transform="translate(690 330) rotate(14)">
        <path d="M-90 -50 L40 -50 L110 0 L40 50 L-90 50 Z" fill="#121114" transform="translate(12 12)"/>
        <path d="M-90 -50 L40 -50 L110 0 L40 50 L-90 50 Z" fill="#C8322E" stroke="#121114" stroke-width="12" stroke-linejoin="round"/>
        <circle cx="52" cy="0" r="14" fill="#F2F3EF" stroke="#121114" stroke-width="8"/>
        <rect x="-70" y="-10" width="96" height="20" rx="10" fill="#F2F3EF" stroke="#121114" stroke-width="7"/>
      </g>
    </g>

    <!-- LEADERS: a trophy on the top step of a three-step podium -->
    <g class="v leaders">
      <!-- podium -->
      <g stroke="#121114" stroke-width="14" stroke-linejoin="round">
        <rect x="266" y="620" width="180" height="180" rx="16" fill="#121114" transform="translate(14 14)"/>
        <rect x="266" y="620" width="180" height="180" rx="16" fill="#B9BCB5"/>
        <rect x="634" y="670" width="180" height="130" rx="16" fill="#121114" transform="translate(14 14)"/>
        <rect x="634" y="670" width="180" height="130" rx="16" fill="#F2F3EF"/>
        <rect x="446" y="540" width="188" height="260" rx="16" fill="#121114" transform="translate(14 14)"/>
        <rect x="446" y="540" width="188" height="260" rx="16" fill="#C8322E"/>
      </g>
      <!-- laurel dots on the steps -->
      <g fill="#F2F3EF" stroke="#121114" stroke-width="8">
        <circle cx="356" cy="710" r="26"/><circle cx="724" cy="735" r="26"/>
      </g>
      <circle cx="540" cy="670" r="34" fill="#F7C728" stroke="#121114" stroke-width="10"/>
      <!-- trophy -->
      <g transform="translate(540 380)">
        <path d="M-96 -110 L96 -110 L84 20 C 70 80, 40 110, 0 120 C -40 110, -70 80, -84 20 Z" fill="#121114" transform="translate(14 14)"/>
        <path d="M-96 -110 L96 -110 L84 20 C 70 80, 40 110, 0 120 C -40 110, -70 80, -84 20 Z" fill="#F7C728" stroke="#121114" stroke-width="14" stroke-linejoin="round"/>
        <path d="M-96 -80 C -170 -80, -170 30, -80 40" fill="none" stroke="#121114" stroke-width="30" stroke-linecap="round"/>
        <path d="M96 -80 C 170 -80, 170 30, 80 40" fill="none" stroke="#121114" stroke-width="30" stroke-linecap="round"/>
        <path d="M-96 -80 C -170 -80, -170 30, -80 40" fill="none" stroke="#F7C728" stroke-width="14" stroke-linecap="round"/>
        <path d="M96 -80 C 170 -80, 170 30, 80 40" fill="none" stroke="#F7C728" stroke-width="14" stroke-linecap="round"/>
        <rect x="-22" y="118" width="44" height="40" fill="#121114"/>
        <rect x="-70" y="152" width="140" height="34" rx="8" fill="#121114" transform="translate(10 10)"/>
        <rect x="-70" y="152" width="140" height="34" rx="8" fill="#F2F3EF" stroke="#121114" stroke-width="12"/>
        <!-- shine -->
        <path d="M-56 -78 L-46 -10" stroke="#F2F3EF" stroke-width="12" stroke-linecap="round"/>
        <!-- sparkle burst -->
        <path d="M150 -170 L162 -130 L202 -118 L162 -106 L150 -66 L138 -106 L98 -118 L138 -130 Z" fill="#F2F3EF" stroke="#121114" stroke-width="10" stroke-linejoin="round"/>
      </g>
    </g>
  </svg>
</body>
</html>
