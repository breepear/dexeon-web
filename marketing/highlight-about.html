<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dexeon highlight cover: About</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=M+PLUS+Rounded+1c:wght@900&display=swap">
<style>
  /* 1080 x 1080. Instagram crops highlight covers to a circle, so everything
     that matters lives inside the centered disc. Same palette as the site. */
  :root{ --paper:#F2F3EF; --paper2:#FFFFFF; --ink:#121114; --red:#C8322E; --tone:#B9BCB5; }
  html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
  body{background:var(--paper);position:relative;font-family:"M PLUS Rounded 1c",sans-serif}
  .halft{position:absolute;inset:0;background-image:radial-gradient(var(--tone) 2.4px, transparent 3px);background-size:22px 22px;opacity:.7}
  .speed{position:absolute;inset:-10%;opacity:.22;
    background:repeating-conic-gradient(from 0deg at 50% 50%, var(--ink) 0deg .6deg, transparent .6deg 6deg);
    -webkit-mask:radial-gradient(circle at 50% 50%, transparent 40%, #000 52%, #000 70%, transparent 82%);
            mask:radial-gradient(circle at 50% 50%, transparent 40%, #000 52%, #000 70%, transparent 82%)}
  .disc{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;
    background:var(--paper2);border:16px solid var(--ink);box-shadow:inset 0 0 0 12px var(--paper2), inset 0 0 0 20px var(--ink), 22px 22px 0 var(--ink)}
  svg{position:absolute;left:0;top:0}
  .d{font-family:"Anton","Impact",sans-serif;font-size:560px;text-anchor:middle;paint-order:stroke fill;stroke-linejoin:round}
  .label{position:absolute;left:50%;bottom:190px;transform:translateX(-50%) rotate(-3deg);background:var(--red);color:#fff;
    font-weight:900;font-size:44px;letter-spacing:.3em;padding:12px 34px 10px 40px;border:6px solid var(--ink);box-shadow:10px 10px 0 var(--ink)}
</style>
</head>
<body>
  <div class="halft"></div>
  <div class="speed"></div>
  <div class="disc"></div>
  <svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(540 500) skewX(-8) translate(-540 -500)">
      <text class="d" x="566" y="686" fill="#121114" stroke="#121114" stroke-width="30">D</text>
      <text class="d" x="540" y="660" fill="#C8322E" stroke="#121114" stroke-width="30">D</text>
      <text class="d" x="540" y="660" fill="none" stroke="#F2F3EF" stroke-width="9">D</text>
    </g>
  </svg>
  <div class="label">ABOUT</div>
</body>
</html>
