<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dexeon words story</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=M+PLUS+Rounded+1c:wght@700;900&display=swap">
<style>
  /* 1080 x 1920 Instagram Story, kinetic type. A small wordmark holds the top;
     four three-line beats slam in and get wiped by skewed panel sweeps. Shared
     9-second timeline; logo-story.py freezes it at ?t=<seconds> per frame. */
  :root{--paper:#F2F3EF;--paper2:#FFFFFF;--ink:#121114;--ink-soft:#4A484E;--tone:#B9BCB5;--red:#C8322E;--yellow:#F7C728;--blue:#2E5AAC;
        --display:'Anton',Impact,sans-serif;--body:'M PLUS Rounded 1c',system-ui,sans-serif}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body)}
  .shot{position:relative;width:1080px;height:1920px;overflow:hidden}
  .halft{position:absolute;inset:0;background-image:radial-gradient(var(--tone) 2.2px,transparent 3px);background-size:22px 22px;opacity:.55}
  .kana{position:absolute;left:-60px;top:1180px;font-size:520px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:3px #d9dbd4;white-space:nowrap;letter-spacing:-.04em;animation:drift 9s linear both}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-160px)}}

  .wm{position:absolute;left:50%;top:110px;width:300px;margin-left:-150px;animation:drop .45s cubic-bezier(.2,1.3,.4,1) .15s both}
  .wm img{width:100%;display:block}
  @keyframes drop{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:translateY(0)}}
  .rule{position:absolute;left:50%;top:290px;width:120px;height:10px;margin-left:-60px;background:var(--red);transform-origin:center;animation:grow .35s ease-out .5s both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* beats */
  .beat{position:absolute;left:70px;right:70px;top:520px}
  .beat .l{display:block;font-family:var(--display);font-size:250px;line-height:.9;text-transform:uppercase;transform:skewX(-6deg);
           text-shadow:10px 10px 0 var(--paper),18px 18px 0 var(--ink);white-space:nowrap}
  .beat .l.red{color:var(--red)}
  .beat .l.c{text-align:center}
  .beat .l.r{text-align:right}
  .chip{position:absolute;background:var(--paper2);border:6px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:18px 34px;font-size:34px;font-weight:900;white-space:nowrap}
  .sfx{position:absolute;font-family:'Bangers',var(--display);font-size:96px;letter-spacing:.04em;color:var(--ink);background:var(--yellow);border:7px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:12px 36px 6px}
  .sfx.w{background:var(--paper2)}

  /* enters */
  @keyframes cutL{from{opacity:0;transform:skewX(-6deg) translateX(-260px)}60%{opacity:1;transform:skewX(-6deg) translateX(24px)}to{opacity:1;transform:skewX(-6deg) translateX(0)}}
  @keyframes cutR{from{opacity:0;transform:skewX(-6deg) translateX(260px)}60%{opacity:1;transform:skewX(-6deg) translateX(-24px)}to{opacity:1;transform:skewX(-6deg) translateX(0)}}
  @keyframes stamp{from{opacity:0;transform:skewX(-6deg) scale(1.7)}55%{opacity:1;transform:skewX(-6deg) scale(.94)}to{opacity:1;transform:skewX(-6deg) scale(1)}}
  @keyframes rise{from{opacity:0;transform:skewX(-6deg) translateY(160px)}65%{opacity:1;transform:skewX(-6deg) translateY(-18px)}to{opacity:1;transform:skewX(-6deg) translateY(0)}}
  @keyframes pop{0%{opacity:0;transform:scale(0) rotate(-30deg)}65%{opacity:1;transform:scale(1.18) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(var(--rot,-6deg))}}
  /* exit: whole beat lifts and fades just as the sweep covers it */
  @keyframes lift{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}

  /* sweeps */
  .sweep{position:absolute;top:-10%;bottom:-10%;left:-45%;width:190%;background:var(--red);transform:translateX(-120%) skewX(-12deg);z-index:20}
  @keyframes sweep{from{transform:translateX(-120%) skewX(-12deg)}to{transform:translateX(120%) skewX(-12deg)}}
  .sweep.s1{animation:sweep .55s cubic-bezier(.75,0,.2,1) 2.25s forwards}
  .sweep.s2{background:var(--ink);animation:sweep .55s cubic-bezier(.75,0,.2,1) 4.25s forwards}
  .sweep.s3{background:var(--yellow);animation:sweep .55s cubic-bezier(.75,0,.2,1) 6.25s forwards}

  /* beat 1 : 0.5 -> 2.4 */
  .b1{animation:lift .3s ease-in 2.35s forwards}
  .b1 .l1{animation:cutL .45s cubic-bezier(.2,.9,.2,1) .5s both}
  .b1 .l2{animation:cutL .45s cubic-bezier(.2,.9,.2,1) .66s both;font-size:330px}
  .b1 .l3{animation:cutL .45s cubic-bezier(.2,.9,.2,1) .82s both}
  .b1 .chip{left:70px;top:820px;--rot:-4deg;transform:rotate(-4deg);animation:pop .45s cubic-bezier(.2,1.4,.4,1) 1.45s both}
  /* beat 2 : 2.5 -> 4.4 */
  .b2{animation:lift .3s ease-in 4.35s forwards}
  .b2 .l1{animation:stamp .4s cubic-bezier(.2,1,.3,1) 2.55s both}
  .b2 .l2{animation:stamp .4s cubic-bezier(.2,1,.3,1) 2.72s both}
  .b2 .l3{animation:stamp .4s cubic-bezier(.2,1,.3,1) 2.9s both;position:relative;font-size:212px;line-height:1.05}
  .b2 .mark{position:absolute;left:-10px;right:-10px;top:26px;height:176px;background:var(--yellow);z-index:-1;transform-origin:left center;animation:grow .45s cubic-bezier(.2,.9,.2,1) 3.4s both}
  .b2 .chip{right:70px;top:820px;--rot:3deg;transform:rotate(3deg);animation:pop .45s cubic-bezier(.2,1.4,.4,1) 3.75s both}
  /* beat 3 : 4.5 -> 6.4 */
  .b3{animation:lift .3s ease-in 6.35s forwards}
  .b3 .l1{animation:cutL .45s cubic-bezier(.2,.9,.2,1) 4.55s both}
  .b3 .l2{animation:cutR .45s cubic-bezier(.2,.9,.2,1) 4.8s both}
  .b3 .l3{animation:cutL .45s cubic-bezier(.2,.9,.2,1) 5.05s both}
  .b3 .sfx.a{left:80px;top:790px;--rot:-8deg;animation:pop .45s cubic-bezier(.2,1.4,.4,1) 5.5s both}
  .b3 .sfx.b{right:80px;top:760px;--rot:6deg;animation:pop .45s cubic-bezier(.2,1.4,.4,1) 5.72s both}
  /* beat 4 : 6.5 -> end */
  .b4 .l1{animation:rise .5s cubic-bezier(.2,1.1,.3,1) 6.55s both}
  .b4 .l2{animation:rise .5s cubic-bezier(.2,1.1,.3,1) 6.72s both}
  .b4 .l3{animation:rise .5s cubic-bezier(.2,1.1,.3,1) 6.9s both}
  .eyebrow{position:absolute;left:0;right:0;top:1420px;text-align:center;font-size:30px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft);animation:fade .4s ease-out 7.5s both}
  .eyebrow::before,.eyebrow::after{content:"";display:inline-block;width:70px;height:8px;background:var(--red);vertical-align:middle;margin:0 24px}
  @keyframes fade{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  .pill{position:absolute;left:50%;top:1520px;background:var(--ink);color:var(--paper);font-weight:900;font-size:36px;letter-spacing:.08em;padding:24px 52px;border:5px solid var(--paper);box-shadow:12px 12px 0 var(--red);white-space:nowrap;
        animation:pillpop .5s cubic-bezier(.2,1.4,.4,1) 7.9s both}
  @keyframes pillpop{0%{opacity:0;transform:translateX(-50%) scale(.5)}65%{opacity:1;transform:translateX(-50%) scale(1.08)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
  .b4 .sfx{right:30px;top:660px;--rot:7deg;animation:pop .45s cubic-bezier(.2,1.4,.4,1) 7.25s both}
</style>
</head>
<body>
<div class="shot">
  <div class="halft"></div>
  <div class="kana" aria-hidden="true">デクセオン</div>
  <div class="wm"><img src="../assets/logo/dexeon-wordmark-nav.png" alt="Dexeon"></div>
  <div class="rule"></div>

  <div class="beat b1">
    <span class="l l1">All</span>
    <span class="l l2 red">1025</span>
    <span class="l l3">Species.</span>
    <div class="chip">One list · nine generations · ひとつ</div>
  </div>

  <div class="beat b2">
    <span class="l l1 c">Your</span>
    <span class="l l2 c red">Binders.</span>
    <span class="l l3 c">Anywhere.<i class="mark"></i></span>
    <div class="chip">Card show · beach · couch</div>
  </div>

  <div class="beat b3">
    <span class="l l1">Trade.</span>
    <span class="l l2 r red">DM.</span>
    <span class="l l3">Climb.</span>
    <div class="sfx a">DEAL!</div>
    <div class="sfx b w">やった!</div>
  </div>

  <div class="beat b4">
    <span class="l l1 c">Track</span>
    <span class="l l2 c red">’Em</span>
    <span class="l l3 c">All.</span>
    <div class="sfx">ドン!</div>
  </div>
  <div class="eyebrow">Free during beta · iPhone</div>
  <div class="pill">dexeontcg.com</div>

  <div class="sweep s1"></div>
  <div class="sweep s2"></div>
  <div class="sweep s3"></div>
</div>
<script>
  var m = location.search.match(/[?&]t=([\d.]+)/);
  if (m) {
    var t = parseFloat(m[1]) * 1000;
    document.body.offsetWidth;
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t; });
  }
</script>
</body>
</html>
